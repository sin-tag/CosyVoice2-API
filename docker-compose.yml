services:
  app:
    build: .
    ports:
      - "8000:8000"
    env_file: .env
    volumes:
      - ./storage:/app/storage
      - model_cache:/root/.cache/huggingface
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    command: >
      sh -c "
        cd /app/src &&
        uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 1
      "

volumes:
  model_cache:
