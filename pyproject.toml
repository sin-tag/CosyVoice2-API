[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "voice-fast-service"
version = "0.1.0"
description = "High-speed voice streaming & cloning API with MOSS-TTS and Qwen3-TTS"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "sqlalchemy[asyncio]>=2.0.35",
    "aiosqlite>=0.20.0",
    "alembic>=1.14.0",
    "python-multipart>=0.0.12",
    "sse-starlette>=2.1.0",
    "websockets>=13.0",
    "soundfile>=0.12.1",
    "numpy>=1.26.0",
    "aiofiles>=24.1.0",
]

[project.optional-dependencies]
cu124 = [
    "torch>=2.6.0",
    "torchaudio>=2.6.0",
]
moss = [
    "transformers>=5.0.0",
]
qwen = [
    "qwen-tts>=0.1.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.27.0",
    "ruff>=0.7.0",
]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
